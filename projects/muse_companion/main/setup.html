<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi Setup</title>
<style>body{margin:0;background:#101010;color:#fff3ea;font:16px system-ui,sans-serif}main{max-width:440px;margin:16px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px}p{color:#c9c3bd;line-height:1.7}label{display:block;margin:20px 0 8px}input,select{box-sizing:border-box;width:100%;border:1px solid #4b4640;border-radius:14px;background:#222;color:white;padding:14px;font:inherit;min-width:0}button{border:0;border-radius:14px;padding:12px 18px;background:#d0ebdd;color:#302a24;font:inherit;cursor:pointer}button:disabled{opacity:.55}#save{width:100%;margin-top:24px;background:#ffe1d0}#status{min-height:40px;white-space:pre-line}small{display:block;color:#c9c3bd;margin-top:12px;line-height:1.6}.show{display:flex;align-items:center;gap:8px;font-size:14px}.show input{width:auto}h3{margin-top:30px;border-top:1px solid #4b4640;padding-top:24px}</style>
<main><header><h1>Mochi</h1><button id="language" type="button">English</button></header><h2 id="heading"></h2><p id="intro"></p>
<form id="form" autocomplete="off"><label for="muse">Muse token</label><input id="muse" type="password" maxlength="63" required autocomplete="off" autocapitalize="off" spellcheck="false">
<h3 id="ttsHeading"></h3><label for="preset" id="presetLabel"></label><select id="preset"><option value="qwen">Qwen · 阿里百炼</option><option value="siliconflow">SiliconFlow</option><option value="openai">OpenAI</option><option value="custom" id="customOption"></option></select>
<label for="url" id="urlLabel"></label><input id="url" type="url" maxlength="255" required value="wss://dashscope.aliyuncs.com/api-ws/v1/realtime" autocapitalize="off" spellcheck="false"><small id="urlNote"></small>
<label for="tts" id="ttsLabel"></label><input id="tts" type="password" maxlength="511" required autocomplete="off" autocapitalize="off" spellcheck="false">
<label for="model" id="modelLabel"></label><input id="model" maxlength="127" required value="qwen3-tts-flash-realtime" autocapitalize="off" spellcheck="false">
<label for="voice" id="voiceLabel"></label><input id="voice" maxlength="127" required value="Cherry" autocapitalize="off" spellcheck="false">
<label for="rate" id="rateLabel"></label><select id="rate"><option value="16000" id="rate16"></option><option value="24000" id="rate24"></option></select>
<label class="show"><input id="show" type="checkbox"><span id="showLabel"></span></label><button id="save" type="submit"></button></form><p id="status" role="status" aria-live="polite"></p><small id="note"></small></main>
<script>
const words={zh:{heading:'首次配置',intro:'填写 Muse 和语音服务配置。保存后设备自动重启，再打开 Muse App 完成联网与账号配对。',ttsHeading:'朗读服务',presetLabel:'服务提供方',customOption:'自定义兼容服务',urlLabel:'TTS API 地址',urlNote:'千问选 WSS 实时接口；其他服务填写完整 HTTPS 语音接口地址。',ttsLabel:'TTS token',modelLabel:'模型名称',voiceLabel:'音色名称',rateLabel:'语音接口类型',rate16:'PCM 16 kHz · 千问 / 硅基流动',rate24:'OpenAI 兼容 · PCM 24 kHz',showLabel:'显示 token',save:'保存并重启',note:'自定义服务须兼容所选语音接口，返回单声道 PCM16 原始音频。此页检查格式，实际服务结果用于确认 token、模型和音色是否有效。',invalid:'请完整填写配置。使用 HTTPS 或 WSS 地址，token 和名称不要包含空格或换行。',saving:'正在保存…',success:'已保存，设备正在重启。请切回常用 Wi-Fi，并打开 Muse App 完成配对。',failed:'保存失败，请重试。',network:'连接中断，请保持连接设备热点，再重试。'},en:{heading:'First-time setup',intro:'Enter your Muse and speech service settings. After saving, the device restarts. Open the Muse app to connect Wi-Fi and pair your account.',ttsHeading:'Speech service',presetLabel:'Provider',customOption:'Custom compatible service',urlLabel:'TTS API URL',urlNote:'Use the Qwen WSS realtime endpoint or a full HTTPS speech endpoint.',ttsLabel:'TTS token',modelLabel:'Model name',voiceLabel:'Voice name',rateLabel:'Speech API type',rate16:'PCM 16 kHz · Qwen / SiliconFlow',rate24:'OpenAI compatible · PCM 24 kHz',showLabel:'Show tokens',save:'Save and restart',note:'Custom services must match the selected API and return raw mono PCM16 audio. This page checks format; service responses confirm the token, model and voice.',invalid:'Complete all fields. Use an HTTPS or WSS URL; tokens and names must not contain spaces or line breaks.',saving:'Saving…',success:'Saved. The device is restarting. Return to your usual Wi-Fi and open the Muse app to pair.',failed:'Could not save. Please try again.',network:'Connection lost. Stay connected to the device hotspot and try again.'}};
let lang=navigator.language.startsWith('zh')?'zh':'en',state='',nonce='';const $=id=>document.getElementById(id);
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';for(const id of Object.keys(words[lang]))if($(id))$(id).textContent=words[lang][id];$('language').textContent=lang==='zh'?'English':'中文';$('status').textContent=state?words[lang][state]:'';}
$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';render();};$('show').onchange=()=>{for(const id of ['muse','tts'])$(id).type=$('show').checked?'text':'password';};
$('preset').onchange=()=>{const preset=$('preset').value;if(preset==='custom')return;if(preset==='qwen'){$('url').value='wss://dashscope.aliyuncs.com/api-ws/v1/realtime';$('model').value='qwen3-tts-flash-realtime';$('voice').value='Cherry';$('rate').value='16000';return;}const sf=preset==='siliconflow';$('url').value=sf?'https://api.siliconflow.cn/v1/audio/speech':'https://api.openai.com/v1/audio/speech';$('model').value=sf?'fnlp/MOSS-TTSD-v0.5':'tts-1';$('voice').value=sf?'fnlp/MOSS-TTSD-v0.5:claire':'alloy';$('rate').value=sf?'16000':'24000';};
for(const id of ['url','model','voice','rate'])$(id).addEventListener('input',()=>{$('preset').value='custom';});
async function session(){const response=await fetch('/api/session',{cache:'no-store'});if(!response.ok)throw Error();nonce=(await response.json()).nonce;}
$('form').onsubmit=async event=>{event.preventDefault();const config={muse_token:$('muse').value.trim(),tts_token:$('tts').value.trim(),tts_url:$('url').value.trim(),tts_model:$('model').value.trim(),tts_voice:$('voice').value.trim(),tts_sample_rate:Number($('rate').value)};
if(Object.values(config).some(value=>typeof value==='string'&&(!value||/[^\x21-\x7e]/.test(value)))||!(/^(https|wss):\/\//.test(config.tts_url))||/[@#]/.test(config.tts_url)){state='invalid';render();return;}state='saving';$('save').disabled=true;render();try{if(!nonce)await session();const response=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Nonce':nonce},body:JSON.stringify(config)});if(!response.ok){state=response.status===400?'invalid':'failed';}else{state='success';$('muse').value='';$('tts').value='';}}catch{state='network';}if(state!=='success')$('save').disabled=false;render();};render();
</script></html>
